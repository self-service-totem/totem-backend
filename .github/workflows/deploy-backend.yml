name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to deploy"
        required: true
        type: choice
        options:
          - dev
          - main

      release_version:
        description: "Release version. Example: v1.0.0"
        required: true
        type: string

      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

      ticket:
        description: "Ticket (required for prod)"
        required: false
        type: string

      accept_checklist:
        description: "Accept deployment checklist"
        required: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.accept_checklist }}" != "true" ]; then
            echo "Checklist must be accepted."
            exit 1
          fi

          if [ "${{ inputs.target }}" = "prod" ] && [ -z "${{ inputs.ticket }}" ]; then
            echo "Ticket is required for production deploy."
            exit 1
          fi

          if [ "${{ inputs.target }}" = "prod" ] && [ "${{ inputs.source_branch }}" != "main" ]; then
            echo "Production deployments must come from main."
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Validate tag
        run: |
          if git rev-parse "${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "Tag already exists"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: SAM build
        run: sam build --debug

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ${{ vars.SAM_STACK_NAME }} \
            --s3-bucket ${{ vars.SAM_ARTIFACTS_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ vars.AWS_REGION }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --on-failure DELETE \
            --parameter-overrides \
              Environment=${{ inputs.target }} \
              ReleaseVersion=${{ inputs.release_version }}

      - name: Publish OpenAPI
        run: |
          aws s3 cp openapi.yaml s3://${{ vars.OPENAPI_BUCKET }}/openapi.yaml \
            --content-type "application/yaml" \
            --cache-control "no-cache"

          aws s3 cp openapi.yaml s3://${{ vars.OPENAPI_BUCKET }}/${{ inputs.release_version }}/openapi.yaml \
            --content-type "application/yaml" \
            --cache-control "no-cache"

      - name: Tag release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"
