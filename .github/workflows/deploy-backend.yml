name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to deploy"
        required: true
        type: choice
        options:
          - dev
          - main

      release_version:
        description: "Release version. Example: v1.0.0"
        required: true
        type: string

      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

      ticket:
        description: "Ticket (required for prod)"
        required: false
        type: string

      accept_checklist:
        description: "Accept deployment checklist"
        required: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment inputs
        run: |
          if [ "${{ inputs.accept_checklist }}" != "true" ]; then
            echo "Checklist must be accepted."
            exit 1
          fi

          if [ "${{ inputs.target }}" = "prod" ] && [ -z "${{ inputs.ticket }}" ]; then
            echo "Ticket is required for production deploy."
            exit 1
          fi

          if [ "${{ inputs.target }}" = "prod" ] && [ "${{ inputs.source_branch }}" != "main" ]; then
            echo "Production deployments must come from main."
            exit 1
          fi

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Validate tag does not exist
        run: |
          if git rev-parse "${{ inputs.release_version }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ inputs.release_version }}"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: |
          mvn clean package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: |
            .
            !.git
            !target
            !.github

  sam-deploy:
    name: Deploy SAM stack
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.target }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: .

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: SAM build
        run: |
          sam build --template-file template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name ${{ vars.SAM_STACK_NAME }} \
            --s3-bucket ${{ vars.SAM_ARTIFACTS_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ vars.AWS_REGION }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=${{ inputs.target }} \
              ReleaseVersion=${{ inputs.release_version }}

      - name: Show CloudFormation events on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name ${{ vars.SAM_STACK_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --max-items 20

  publish-openapi:
    name: Publish OpenAPI
    runs-on: ubuntu-latest
    needs: sam-deploy
    environment: ${{ inputs.target }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Publish OpenAPI to S3
        run: |
          aws s3 cp openapi.yaml s3://${{ vars.OPENAPI_BUCKET }}/openapi.yaml \
            --content-type "application/yaml" \
            --cache-control "no-cache"

          aws s3 cp openapi.yaml s3://${{ vars.OPENAPI_BUCKET }}/${{ inputs.release_version }}/openapi.yaml \
            --content-type "application/yaml" \
            --cache-control "no-cache"

  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    needs: publish-openapi

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"
