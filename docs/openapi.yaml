openapi: 3.0.3
info:
  title: Price List API
  version: 0.1.0
  description: API contract for the price list backend module.
servers:
  - url: https://k6ug3eg7uh.execute-api.sa-east-1.amazonaws.com/dev
paths:
  /price-lists/{priceListId}:
    get:
      summary: Get a price list
      operationId: getPriceList
      parameters:
        - name: priceListId
          in: path
          required: true
          schema:
            type: string
          example: default
      responses:
        '200':
          description: Price list found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PriceListDocument'
        '400':
          description: Invalid request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
components:
  schemas:
    PriceListDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PriceListResource'
    PriceListResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          example: price-lists
        id:
          type: string
          example: default
        attributes:
          type: object
          properties:
            products:
              type: array
              items:
                $ref: '#/components/schemas/ProductAttributes'
    ProductAttributes:
      type: object
      properties:
        id:
          type: string
          example: P-001
        name:
          type: string
          example: Café Especial 500g
        price:
          type: number
          example: 12.9
        currency:
          type: string
          example: USD
    ErrorDocument:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                example: '400'
              title:
                type: string
                example: Bad Request
              detail:
                type: string
                example: Path parameter 'priceListId' is required
