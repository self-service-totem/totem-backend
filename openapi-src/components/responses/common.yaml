BadRequest:
  description: Invalid request syntax, path parameter, query parameter, or body.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
NotFound:
  description: Resource not found.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
Conflict:
  description: Resource conflict.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
UnprocessableEntity:
  description: Request is syntactically valid but violates a business rule.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
TooManyRequests:
  description: Rate limit exceeded.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
InternalServerError:
  description: Unexpected server error.
  content:
    application/vnd.api+json:
      schema:
        $ref: '#/components/schemas/ErrorDocument'
