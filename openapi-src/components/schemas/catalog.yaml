CatalogVersionDocument:
  type: object
  required:
  - data
  properties:
    data:
      $ref: '#/components/schemas/CatalogVersionResource'
CatalogVersionResource:
  type: object
  required:
  - type
  - id
  - attributes
  properties:
    type:
      type: string
      enum:
      - catalog-versions
      example: catalog-versions
    id:
      type: string
      example: branch-001
    attributes:
      $ref: '#/components/schemas/CatalogVersionAttributes'
CatalogVersionAttributes:
  type: object
  required:
  - branchId
  - catalogVersion
  - priceListId
  properties:
    branchId:
      type: string
      example: branch-001
    catalogVersion:
      type: string
      format: date-time
      example: '2026-05-20T12:00:00Z'
    priceListId:
      type: string
      example: default
