/branches/{branchId}/catalog/version:
  get:
    tags:
    - Catalog
    summary: Get catalog version for a branch
    description: Returns the current catalog version for a branch. A kiosk can use
      this endpoint to know if it must refresh its local cached catalog.
    operationId: getCatalogVersion
    x-amazon-apigateway-integration:
      type: aws_proxy
      httpMethod: POST
      uri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
      payloadFormatVersion: '2.0'
    parameters:
    - name: branchId
      in: path
      required: true
      description: Branch identifier.
      schema:
        type: string
      example: branch-001
    responses:
      '200':
        description: Catalog version found
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CatalogVersionDocument'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalServerError'
