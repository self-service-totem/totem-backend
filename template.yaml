AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Price List Lambda with Spring Cloud Function, Java 21 and API Gateway HTTP API

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 90
    Architectures:
      - x86_64
    Environment:
      Variables:
        SPRING_CLOUD_FUNCTION_DEFINITION: apiGatewayRouter
        SPRING_MAIN_WEB_APPLICATION_TYPE: none
        MAIN_CLASS: com.ffresco.pricelist.PriceListLambdaApplication
        ENVIRONMENT: !Ref Environment
        RELEASE_VERSION: !Ref ReleaseVersion

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues:
      - local
      - dev
      - prod

  ReleaseVersion:
    Type: String
    Default: local

Resources:
  PriceListHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 600

  PriceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      FunctionName: !Sub price-list-lambda-${Environment}
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      CodeUri: ./
      Description: Price list Lambda using Spring Cloud Function
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        GetPriceList:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriceListHttpApi
            Path: /price-lists/{priceListId}
            Method: GET

        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriceListHttpApi
            Path: /health
            Method: GET

Outputs:
  PriceListFunctionName:
    Description: Lambda function name
    Value: !Ref PriceListFunction

  PriceListFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PriceListFunction.Arn

  PriceListApiUrl:
    Description: API Gateway HTTP API base URL
    Value: !Sub "https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  GetPriceListUrl:
    Description: Example price list endpoint
    Value: !Sub "https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/price-lists/default"