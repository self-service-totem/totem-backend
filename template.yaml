AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Price List Lambda with Spring Cloud Function, Java 21 and API Gateway HTTP API

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 90
    Architectures:
      - x86_64
    Environment:
      Variables:
        # AWS/API Gateway function. Local Spring execution keeps application.yml for direct function testing.
        SPRING_CLOUD_FUNCTION_DEFINITION: apiGatewayRouter
        SPRING_MAIN_WEB_APPLICATION_TYPE: none
        MAIN_CLASS: com.ffresco.pricelist.PriceListLambdaApplication

Resources:
  PriceListHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev

  PriceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      FunctionName: price-list-lambda-sam
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      CodeUri: ./
      Description: Price list Lambda using Spring Cloud Function
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        # These events define routes and also attach Lambda integration/permissions.
        GetPriceList:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriceListHttpApi
            Path: /price-lists/{priceListId}
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriceListHttpApi
            Path: /health
            Method: GET

Outputs:
  PriceListFunctionName:
    Description: Lambda function name
    Value: !Ref PriceListFunction

  PriceListFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PriceListFunction.Arn

  PriceListApiUrl:
    Description: API Gateway HTTP API base URL
    Value: !Sub "https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/dev"

  GetPriceListUrl:
    Description: Example price list endpoint
    Value: !Sub "https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/dev/price-lists/default"
