AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Price List Lambda with Spring Cloud Function, Java 21 and API Gateway HTTP API

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 90
    Architectures:
      - x86_64
    Environment:
      Variables:
        # AWS/API Gateway function. Local Spring execution keeps application.yml=listPrice.
        SPRING_CLOUD_FUNCTION_DEFINITION: listPriceApiGateway
        SPRING_MAIN_WEB_APPLICATION_TYPE: none

Resources:
  PriceListHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - OPTIONS

  PriceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      FunctionName: price-list-lambda-sam
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      CodeUri: target/price-list-lambda-0.0.1-SNAPSHOT-aws.jar
      Description: Price list Lambda using Spring Cloud Function
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        GetPriceList:
          Type: HttpApi
          Properties:
            ApiId: !Ref PriceListHttpApi
            Path: /price-lists/{priceListId}
            Method: GET
            PayloadFormatVersion: '2.0'

Outputs:
  PriceListFunctionName:
    Description: Lambda function name
    Value: !Ref PriceListFunction

  PriceListFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PriceListFunction.Arn

  PriceListApiUrl:
    Description: API Gateway HTTP API URL
    Value: !Sub "https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/dev/price-lists/default"
