AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Price List Lambda with Spring Cloud Function, Java 21 and API Gateway HTTP API

Globals:
  Function:
    Runtime: java21
    MemorySize: 1024
    Timeout: 90
    Architectures:
      - x86_64
    Environment:
      Variables:
        SPRING_CLOUD_FUNCTION_DEFINITION: apiGatewayRouter
        SPRING_MAIN_WEB_APPLICATION_TYPE: none
        MAIN_CLASS: com.ffresco.pricelist.PriceListLambdaApplication
        ENVIRONMENT: !Ref Environment
        RELEASE_VERSION: !Ref ReleaseVersion
        TOTEM_CORE_TABLE_NAME: !Ref TotemCoreTable

Parameters:
  Environment:
    Type: String
    Default: local
    AllowedValues:
      - local
      - dev
      - prod

  ReleaseVersion:
    Type: String
    Default: local

Resources:
  PriceListHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi.yaml

  PriceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      FunctionName: !Sub price-list-lambda-${Environment}
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      CodeUri: ./
      Description: Price list Lambda using Spring Cloud Function
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref TotemCoreTable
      Tags:
        Project: totem
        Environment: !Ref Environment

  PriceListFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PriceListFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PriceListHttpApi}/*/*/*

  TotemCoreTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub totem-core-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: totem
        - Key: Environment
          Value: !Ref Environment

Outputs:
  PriceListFunctionName:
    Description: Lambda function name
    Value: !Ref PriceListFunction

  PriceListFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PriceListFunction.Arn

  PriceListApiUrl:
    Description: API Gateway HTTP API base URL
    Value: !Sub https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  GetPriceListUrl:
    Description: Example price list endpoint
    Value: !Sub https://${PriceListHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/price-lists/default

  TotemCoreTableName:
    Description: DynamoDB table name
    Value: !Ref TotemCoreTable

  TotemCoreTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt TotemCoreTable.Arn