openapi: 3.0.3
info:
  title: Totem Core API
  version: 0.1.0
  license:
    name: Proprietary
    url: http://tobe.done.com
  description: 'JSON:API-first contract for the Totem Core Lambda.

    This generated file is the API contract used by AWS SAM.

    Source fragments live in openapi-src/.

    '
servers:
- url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
  description: AWS API Gateway HTTP API
  variables:
    apiId:
      default: api-id
    region:
      default: sa-east-1
    stage:
      default: dev
security: []
x-amazon-apigateway-cors:
  allowOrigins:
  - '*'
  allowMethods:
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - OPTIONS
  allowHeaders:
  - Content-Type
  - Authorization
  - Accept
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Returns the current status of the Lambda API.
      operationId: getHealth
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
        payloadFormatVersion: '2.0'
      responses:
        '200':
          description: API is healthy
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HealthDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /price-lists/{priceListId}:
    get:
      tags:
      - Price Lists
      summary: Get a price list
      description: Returns one price list by id using a JSON:API resource document.
      operationId: getPriceList
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
        payloadFormatVersion: '2.0'
      parameters:
      - name: priceListId
        in: path
        required: true
        description: Price list identifier.
        schema:
          type: string
        example: default
      responses:
        '200':
          description: Price list found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PriceListDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /branches/{branchId}/catalog/version:
    get:
      tags:
      - Catalog
      summary: Get catalog version for a branch
      description: Returns the current catalog version for a branch. A kiosk can use
        this endpoint to know if it must refresh its local cached catalog.
      operationId: getCatalogVersion
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
        payloadFormatVersion: '2.0'
      parameters:
      - name: branchId
        in: path
        required: true
        description: Branch identifier.
        schema:
          type: string
        example: branch-001
      responses:
        '200':
          description: Catalog version found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CatalogVersionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/menu:
    get:
      tags:
      - Public Menu
      summary: Get the public menu for a table
      description: Returns the available menu (categories with available products
        only) for the branch associated with the given public table id. Used by customers
        who scan a QR code at a table.
      operationId: getPublicMenu
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
        payloadFormatVersion: '2.0'
      parameters:
      - name: tableId
        in: query
        required: true
        description: Public table identifier (the value encoded in the QR code).
        schema:
          type: string
        example: tbl-public-001
      responses:
        '200':
          description: Public menu found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PublicMenuDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/menu/products/{productId}:
    get:
      tags:
      - Public Menu
      summary: Get a public product detail
      description: Returns one product visible in the public menu for the table associated
        with the given public table id. Returns 404 if the product is not part of
        the available menu for that table.
      operationId: getPublicProductDetail
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PriceListFunction.Arn}/invocations
        payloadFormatVersion: '2.0'
      parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
        example: prd-001
      - name: tableId
        in: query
        required: true
        description: Public table identifier (the value encoded in the QR code).
        schema:
          type: string
        example: tbl-public-001
      responses:
        '200':
          description: Public product found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PublicProductDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HealthDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/HealthResource'
    HealthResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          example: health
        id:
          type: string
          example: current
        attributes:
          $ref: '#/components/schemas/HealthAttributes'
    HealthAttributes:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    ErrorDocument:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiError'
    JsonApiError:
      type: object
      required:
      - status
      - title
      - detail
      properties:
        status:
          type: string
          example: '400'
        code:
          type: string
          description: Application-specific error code for clients to branch on.
          example: PUBLIC_TABLE_NOT_FOUND
        title:
          type: string
          example: Bad Request
        detail:
          type: string
          example: Path parameter 'priceListId' is required
    PriceListDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PriceListResource'
    PriceListResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - price-lists
          example: price-lists
        id:
          type: string
          example: default
        attributes:
          $ref: '#/components/schemas/PriceListAttributes'
    PriceListAttributes:
      type: object
      required:
      - products
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/PriceListProductAttributes'
    PriceListProductAttributes:
      type: object
      required:
      - id
      - name
      - price
      - currency
      properties:
        id:
          type: string
          example: P-001
        name:
          type: string
          example: Café Especial 500g
        price:
          type: number
          format: double
          example: 12.9
        currency:
          type: string
          example: USD
    CatalogVersionDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CatalogVersionResource'
    CatalogVersionResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - catalog-versions
          example: catalog-versions
        id:
          type: string
          example: branch-001
        attributes:
          $ref: '#/components/schemas/CatalogVersionAttributes'
    CatalogVersionAttributes:
      type: object
      required:
      - branchId
      - catalogVersion
      - priceListId
      properties:
        branchId:
          type: string
          example: branch-001
        catalogVersion:
          type: string
          format: date-time
          example: '2026-05-20T12:00:00Z'
        priceListId:
          type: string
          example: default
    PublicMoneyAttributes:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal amount serialized as a string with two fractional digits.
          example: '12.50'
        currency:
          type: string
          example: BRL
    PublicMenuProductAttributes:
      type: object
      required:
      - id
      - name
      - price
      - available
      properties:
        id:
          type: string
          example: prd-001
        name:
          type: string
          example: Cheeseburger
        description:
          type: string
          nullable: true
          example: Beef patty, cheddar, brioche bun.
        price:
          $ref: '#/components/schemas/PublicMoneyAttributes'
        available:
          type: boolean
          example: true
    PublicMenuCategoryAttributes:
      type: object
      required:
      - id
      - name
      - products
      properties:
        id:
          type: string
          example: cat-burgers
        name:
          type: string
          example: Burgers
        products:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuProductAttributes'
    PublicMenuAttributes:
      type: object
      required:
      - branchId
      - tableId
      - currency
      - categories
      properties:
        branchId:
          type: string
          example: branch-001
        tableId:
          type: string
          example: tbl-001
        currency:
          type: string
          example: BRL
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuCategoryAttributes'
    PublicMenuResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - public-menu
          example: public-menu
        id:
          type: string
          example: branch-001-menu
        attributes:
          $ref: '#/components/schemas/PublicMenuAttributes'
    PublicMenuDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PublicMenuResource'
    PublicProductAttributes:
      type: object
      required:
      - branchId
      - tableId
      - name
      - price
      - available
      - categoryId
      - categoryName
      properties:
        branchId:
          type: string
          example: branch-001
        tableId:
          type: string
          example: tbl-001
        name:
          type: string
          example: Cheeseburger
        description:
          type: string
          nullable: true
          example: Beef patty, cheddar, brioche bun.
        price:
          $ref: '#/components/schemas/PublicMoneyAttributes'
        available:
          type: boolean
          example: true
        categoryId:
          type: string
          example: cat-burgers
        categoryName:
          type: string
          example: Burgers
    PublicProductResource:
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - public-product
          example: public-product
        id:
          type: string
          example: prd-001
        attributes:
          $ref: '#/components/schemas/PublicProductAttributes'
    PublicProductDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/PublicProductResource'
  responses:
    BadRequest:
      description: Invalid request syntax, path parameter, query parameter, or body.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: Resource not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Conflict:
      description: Resource conflict.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnprocessableEntity:
      description: Request is syntactically valid but violates a business rule.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
